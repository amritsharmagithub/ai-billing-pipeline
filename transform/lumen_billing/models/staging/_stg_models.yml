# Tests for the staging models.
# These are basic controls on the data's structure: IDs are unique and filled in,
# links between tables are valid, and categories only use expected values.

version: 2

models:
  - name: stg_customers
    description: "One row per customer company."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_subscriptions
    description: "One row per customer's plan, with prices copied at signup."
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: plan_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['Starter', 'Pro', 'Enterprise']

  - name: stg_usage_events
    description: "One row per subscription per day of API usage."
    columns:
      - name: usage_id
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id

  - name: stg_invoices
    description: "One row per monthly invoice."
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id

  - name: stg_payments
    description: "One row per payment received."
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: invoice_id
        data_tests:
          # Every payment should point to an invoice. Payments without one are unapplied cash.
          # Set to "warn" so the build continues and the reconciliation can handle them.
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('stg_invoices')
                field: invoice_id
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['card', 'ACH', 'wire']
                