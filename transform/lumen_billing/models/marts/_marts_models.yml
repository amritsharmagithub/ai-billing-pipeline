# Tests for the marts.

version: 2

models:
  - name: fct_invoices
    description: "One row per invoice, with amount paid, balance due, payment status, and aging as of the report date."
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'partially_paid', 'unpaid', 'overpaid']
      - name: aging_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_balance', 'settled', 'current', '1-30', '31-60', '61-90', '90+']

  - name: fct_monthly_revenue
    description: "One row per month: amounts billed (by service month) and cash collected (by payment month)."
    columns:
      - name: month
        data_tests:
          - unique
          - not_null
          